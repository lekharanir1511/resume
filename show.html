<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .show{
            color: red;
        }
        .hide{
            color:green;
                   }
    </style>
</head>
<body>
    <button id="show">show</button>
    <label id="showlebel"></label>
    <script>
        var boolean;
        const button = document.getElementById('show');
        const label = document.getElementById('showlebel');
        button.addEventListener('click', function() {
            boolean = !boolean;
            label.textContent = `${boolean?"label is visible": "label is hidden"}`;
            label.className = boolean? "show":"hide";
        });
    </script>
</body>
</html>
